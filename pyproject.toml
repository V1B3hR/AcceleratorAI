[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "accelerator-ai"
version = "0.5.0"
description = "Production-Ready Biomimetic Training Dynamics Optimizer: 5x deeper loss convergence and automated dynamic curriculum learning for neural networks."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "AcceleratorAI Team" }]
license = { text = "MIT" }
keywords = [
    "deep-learning",
    "training-dynamics",
    "curriculum-learning",
    "pytorch-optimizer",
    "neural-networks",
    "telemetry",
    "biomimetic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0"]
wandb = ["wandb>=0.15.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/V1B3hR/AcceleratorAI"
Documentation = "https://github.com/V1B3hR/AcceleratorAI#readme"
Repository = "https://github.com/V1B3hR/AcceleratorAI"

[tool.setuptools.packages.find]
where = ["."]
include = ["accelerator_ai*"]

