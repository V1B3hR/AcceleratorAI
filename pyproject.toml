[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "accelerator-ai"
version = "0.1.0"
description = "VIBE Turbine Architecture: A fluid-dynamics and turbocharger-inspired AI learning accelerator with asynchronous multi-point injection"
readme = "README.md"
authors = [{ name = "AcceleratorAI Team" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0.0"]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["accelerator_ai*"]
